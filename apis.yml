name: Icertis
description: 'Icertis is an AI-native contract intelligence company that turns enterprise
  contracts into structured, actionable data and measurable business outcomes. Its
  Contract Intelligence (ICI) platform manages agreements across their full lifecycle
  — authoring, negotiation, execution, obligation management, and ongoing analytics
  — spanning sell-side, buy-side, and corporate contracts. The platform pairs a configurable
  contract data model with AI capabilities (the "Vera" AI assistant and agent-powered
  drafting, redlining, and negotiation) trained on millions of contracts. Icertis serves
  large enterprises across manufacturing, life sciences, healthcare, technology, financial
  services, and the public sector, and integrates with ERP, CRM, CPQ, and procurement
  systems such as SAP, Salesforce, Microsoft Dynamics, and Coupa. This profile was
  added to the API Evangelist network as a portfolio company of SoftBank Vision Fund
  and enriched from Icertis'' public web presence.'
